[package]
name = "cc-store"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Local viewer storage, audit ledgers and retention for Castle Control"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
fs2 = "0.4.3"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.50", features = ["macros", "rt", "sync", "time"] }
ulid = { version = "1.2.1", features = ["serde"] }

[dev-dependencies]
tempfile = "3.22"
tokio = { version = "1.50", features = ["macros", "rt", "test-util"] }
