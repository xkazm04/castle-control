[package]
name = "cc-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
spike = ["cc-twitch/fault-injection"]

[[bin]]
name = "spike"
path = "src/bin/spike.rs"
required-features = ["spike"]

[dependencies]
axum = { workspace = true, features = ["ws"] }
cc-types = { path = "../cc-types" }
cc-twitch = { path = "../cc-twitch" }
cc-store = { path = "../cc-store" }
cc-obs = { path = "../cc-obs" }
cc-lots = { path = "../cc-lots" }
cc-beacons = { path = "../cc-beacons" }
cc-gatehouse = { path = "../cc-gatehouse" }
cc-verify = { path = "../cc-verify" }
chrono.workspace = true
async-trait = "0.1.89"
ulid = "1.2.1"
futures = "0.3.32"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio.workspace = true
tempfile = "3.22"

[dev-dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["json"] }
tokio-tungstenite = "0.28.0"
