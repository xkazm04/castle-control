[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"
version = "0.1.0"

[workspace.dependencies]
tauri = "~2.12.0"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.38", features = ["bundled"] }
schemars = "1.2"
