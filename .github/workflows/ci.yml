name: gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install Rust toolchain
        run: rustup show
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate
