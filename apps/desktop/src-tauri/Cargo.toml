[package]
name = "cc-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
cc-core = { path = "../../../crates/cc-core" }
cc-store = { path = "../../../crates/cc-store" }
cc-twitch = { path = "../../../crates/cc-twitch" }
cc-obs = { path = "../../../crates/cc-obs" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tauri.workspace = true
tokio.workspace = true
tracing = "0.1.41"

[build-dependencies]
tauri-build = "2.7"

[dev-dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["json"] }
tracing-subscriber = { version = "0.3.20", features = ["fmt"] }
